<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Sensor Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .value { font-size: 2em; font-weight: bold; color: #2c3e50; }
        .chart-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <h2>ESP32 Dashboard (Real-time & History)</h2>
    
    <!-- ส่วน Real-time -->
    <div class="cards">
        <div class="card">
            <h3>อุณหภูมิ</h3>
            <div class="value" id="temp-val">-- °C</div>
        </div>
        <div class="card">
            <h3>ความชื้น</h3>
            <div class="value" id="humi-val">-- %</div>
        </div>
        <div class="card">
            <h3>ความสว่าง</h3>
            <div class="value" id="light-val">--</div>
        </div>
    </div>

    <!-- ส่วน History (กราฟ) -->
    <div class="chart-container">
        <canvas id="historyChart"></canvas>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://project-8725339097983107223-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ดึงข้อมูล Real-time
    const latestRef = ref(db, 'lab/esp32-01/latest');
    onValue(latestRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            document.getElementById('temp-val').innerText = data.temp.toFixed(1) + ' °C';
            document.getElementById('humi-val').innerText = data.humi.toFixed(1) + ' %';
            document.getElementById('light-val').innerText = Math.round(data.light);
        }
    });

    // ตั้งค่า Chart.js ให้มี 2 แกน Y
    const ctx = document.getElementById('historyChart').getContext('2d');
    const historyChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                { label: 'อุณหภูมิ (°C)', borderColor: 'red', data: [], tension: 0.3, yAxisID: 'y' },
                { label: 'ความชื้น (%)', borderColor: 'blue', data: [], tension: 0.3, yAxisID: 'y' },
                { label: 'ความสว่าง', borderColor: '#f39c12', data: [], tension: 0.3, yAxisID: 'y1' } // เส้นสีเหลืองส้ม
            ]
        },
        options: {
            responsive: true,
            animation: false,
            scales: {
                x: { display: true },
                y: {
                    type: 'linear',
                    display: true,
                    position: 'left', // แกนหลัก (ซ้าย) สำหรับอุณหภูมิ/ความชื้น
                },
                y1: {
                    type: 'linear',
                    display: true,
                    position: 'right', // แกนรอง (ขวา) สำหรับความสว่าง
                    grid: {
                        drawOnChartArea: false // ป้องกันเส้นกริดทับซ้อนกัน
                    }
                }
            }
        }
    });

    // ดึงข้อมูล History
    const historyRef = query(ref(db, 'lab/esp32-01/history'), limitToLast(20));
    onValue(historyRef, (snapshot) => {
        const labels = [];
        const tempData = [];
        const humiData = [];
        const lightData = []; // เพิ่ม Array สำหรับเก็บค่าแสง

        snapshot.forEach((childSnapshot) => {
            const data = childSnapshot.val();
            const date = new Date(data.timestamp * 1000); 
            labels.push(date.toLocaleTimeString('th-TH')); 
            tempData.push(data.temp);
            humiData.push(data.humi);
            lightData.push(data.light); // ดึงค่าแสงมาเก็บ
        });

        // อัปเดตข้อมูลกราฟทั้ง 3 เส้น
        historyChart.data.labels = labels;
        historyChart.data.datasets[0].data = tempData;
        historyChart.data.datasets[1].data = humiData;
        historyChart.data.datasets[2].data = lightData; 
        historyChart.update();
    });
</script>

</body>
</html>
